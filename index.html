<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Device | हिंदी कानूनी संपादक</title>
    <style>
        body {
            background: #0f121a;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: #161b26;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #2a3950;
        }
        h1 { margin-bottom: 30px; font-weight: 300; color: #ffbc6e; }
        .options { display: flex; gap: 20px; }
        .card {
            background: #1e2535;
            padding: 30px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            width: 150px;
            border: 2px solid transparent;
        }
        .card:hover {
            background: #2e3d5e;
            border-color: #53d88a;
            transform: translateY(-10px);
        }
        .icon { font-size: 50px; margin-bottom: 15px; }
        .label { font-weight: bold; font-size: 18px; }
        .auto-msg { margin-top: 30px; font-size: 12px; color: #7a8aa8; }
    </style>
</head>
<body>

    <div class="container">
        <h1>आप कौन सा डिवाइस इस्तेमाल कर रहे हैं?</h1>
        <div class="options">
            <div class="card" onclick="window.location.href='pc.html'">
                <div class="icon">💻</div>
                <div class="label">PC / Laptop</div>
            </div>

            <div class="card" onclick="window.location.href='android.html'">
                <div class="icon">📱</div>
                <div class="label">Mobile</div>
            </div>
        </div>
        <p class="auto-msg" id="detecting">Device Detecting...</p>
    </div>

    <script>
        // Automatic Detection Logic
        window.onload = function() {
            const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            const msg = document.getElementById('detecting');
            
            if(isMobile) {
                msg.innerText = "मोबाइल डिटेक्ट हुआ! 3 सेकंड में रीडायरेक्ट हो रहा है...";
                setTimeout(() => { window.location.href = 'index.html'; }, 3000);
            } else {
                msg.innerText = "PC डिटेक्ट हुआ! 3 सेकंड में रीडायरेक्ट हो रहा है...";
                setTimeout(() => { window.location.href = 'application.html'; }, 3000);
            }
        };
    </script>
</body>
</html>
