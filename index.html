<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legal Editor | Select Device</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap');
        
        body {
            font-family: 'Poppins', sans-serif;
            background: radial-gradient(circle at top right, #1e293b, #0f172a);
        }

        .glass {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card-gradient:hover {
            background: linear-gradient(135deg, rgba(83, 216, 138, 0.1) 0%, rgba(59, 130, 246, 0.1) 100%);
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid #53d88a;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-white flex items-center justify-center min-h-screen p-6">

    <div class="glass max-w-2xl w-full p-8 md:p-12 rounded-3xl shadow-2xl text-center transform transition-all">
        
        <div class="mb-10">
            <h1 class="text-3xl md:text-4xl font-semibold text-amber-200 mb-2">हिंदी कानूनी संपादक</h1>
            <p class="text-slate-400 text-sm md:text-base">कृपया अपना डिवाइस चुनें / Please select your device</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div onclick="window.location.href='pc.html'" 
                 class="group glass card-gradient p-8 rounded-2xl cursor-pointer border border-white/5 hover:border-emerald-400/50 transition-all duration-300 hover:-translate-y-2">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform duration-300">💻</div>
                <h2 class="text-xl font-bold mb-1">PC / Laptop</h2>
                <p class="text-xs text-slate-500">Windows / Mac / Linux</p>
            </div>

            <div onclick="window.location.href='android.html'" 
                 class="group glass card-gradient p-8 rounded-2xl cursor-pointer border border-white/5 hover:border-blue-400/50 transition-all duration-300 hover:-translate-y-2">
                <div class="text-6xl mb-4 group-hover:scale-110 transition-transform duration-300">📱</div>
                <h2 class="text-xl font-bold mb-1">Android / Mobile</h2>
                <p class="text-xs text-slate-500">Smartphone / Tablet</p>
            </div>
        </div>

        <div class="mt-12 pt-8 border-t border-white/10">
            <div class="flex items-center justify-center gap-3">
                <span class="loader"></span>
                <p id="status" class="text-slate-400 text-sm tracking-wide">सिस्टम डिटेक्ट कर रहा है...</p>
            </div>
        </div>
    </div>

</body>
</html>
